<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 8px; }
      .bar { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; }
      .term { font-family: "SF Mono", "Monaco", "Menlo", "Courier New", monospace; font-size: 12.5px; fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0883e; font-weight: bold; }
      .pass { fill: #3fb950; font-weight: bold; }
      .fail { fill: #f85149; font-weight: bold; }
      .warn { fill: #d29922; font-weight: bold; }
      .dim { fill: #8b949e; }
      .cyan { fill: #39c5bb; }
      .highlight { fill: #a5d6ff; }
      
      @keyframes step1 {
        0%, 15% { opacity: 0; }
        20%, 100% { opacity: 1; }
      }
      @keyframes step2 {
        0%, 45% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes step3 {
        0%, 75% { opacity: 0; }
        80%, 100% { opacity: 1; }
      }
      @keyframes cursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      .anim-step1 { animation: step1 12s infinite; }
      .anim-step2 { animation: step2 12s infinite; }
      .anim-step3 { animation: step3 12s infinite; }
      .cursor-blink { animation: cursor 1s infinite; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="850" height="480" class="bg"/>
  <rect width="850" height="32" class="bar"/>
  <circle cx="20" cy="16" r="6" class="dot-red"/>
  <circle cx="38" cy="16" r="6" class="dot-yellow"/>
  <circle cx="56" cy="16" r="6" class="dot-green"/>
  <text x="425" y="21" text-anchor="middle" class="title">rollout-sentinel - progressive canary monitor</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)" class="term">
    <!-- Command Execution -->
    <text x="0" y="0"><tspan class="prompt">$</tspan> <tspan class="cmd">rollout-sentinel monitor</tspan> --service retail-checkout-api --namespace production</text>
    
    <!-- Step 1: 10% Canary -->
    <g class="anim-step1">
      <text x="0" y="24" class="dim">--- [STEP 1/3] Evaluating canary at 10% traffic weight (Prometheus Scrape: 60s window) ---</text>
      <text x="0" y="44">Status Verdict:  <tspan class="pass">[PASS]</tspan>  (Canary healthy, all 5 quality gates verified)</text>
      <text x="0" y="64">Action:          <tspan class="cyan">ADVANCE_TRAFFIC_STEP</tspan> -&gt; Promoting canary to 20%</text>
      <text x="0" y="84">Quality Gates:</text>
      <text x="0" y="104">  <tspan class="pass">[PASS]</tspan> ErrorRateGate           -&gt; Canary 5xx rate: 0.012% (Max allowed: 0.500%)</text>
      <text x="0" y="124">  <tspan class="pass">[PASS]</tspan> P99LatencyGate          -&gt; Canary p99: 142.4ms (Max SLA: 500.0ms)</text>
      <text x="0" y="144">  <tspan class="pass">[PASS]</tspan> LatencyDriftGate        -&gt; Drift: +4.2% vs baseline (142.4ms vs 136.6ms)</text>
      <text x="0" y="164">  <tspan class="pass">[PASS]</tspan> MemorySaturationGate    -&gt; Canary memory: 48.2% (Threshold: 85.0%)</text>
    </g>

    <!-- Step 2: 20% Canary with Anomaly Breach -->
    <g class="anim-step2">
      <text x="0" y="200" class="dim">--- [STEP 2/3] Evaluating canary at 20% traffic weight (Prometheus Scrape: 60s window) ---</text>
      <text x="0" y="220">Status Verdict:  <tspan class="fail">[BREACH]</tspan> (SLO violation detected on canary pods)</text>
      <text x="0" y="240">Action:          <tspan class="fail">TRIGGER_AUTOMATED_ROLLBACK</tspan> -&gt; Executing kubectl rollout undo (MTTR: 2m)</text>
      <text x="0" y="260">Quality Gates:</text>
      <text x="0" y="280">  <tspan class="fail">[FAIL]</tspan> ErrorRateGate           -&gt; Canary 5xx rate: <tspan class="fail">2.418%</tspan> (Max allowed: 0.500%)</text>
      <text x="0" y="300">  <tspan class="fail">[FAIL]</tspan> RelativeErrorDegradation -&gt; Error spike: <tspan class="fail">+2.404%</tspan> over baseline (2.418% vs 0.014%)</text>
      <text x="0" y="320">  <tspan class="pass">[PASS]</tspan> P99LatencyGate          -&gt; Canary p99: 188.0ms (Max SLA: 500.0ms)</text>
    </g>

    <!-- Step 3: Fast Incident Triage Output -->
    <g class="anim-step3">
      <text x="0" y="356" class="dim">================================================================================</text>
      <text x="0" y="374" class="highlight">TRIAGE DIAGNOSIS: OOMKilled / Connection Pool Exhaustion on Pod retail-checkout-api-canary-9f2</text>
      <text x="0" y="394">Root Cause:   Synchronous database call in async request path holding cgroup memory buffer</text>
      <text x="0" y="410">Remediation:  1. Rollback confirmed. 2. Refactor DB query into thread pool. 3. Bump heap limit.</text>
    </g>
  </g>
</svg>
