name: Claude PR Review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  DIFF_FILE: pr.diff
  REVIEW_FILE: pr_review.md

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- '*.go' 'go.mod' 'deploy/**' > "$DIFF_FILE"
          echo "Diff line count: $(wc -l < "$DIFF_FILE")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic pydantic

      - name: Run Claude Code Review
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POST_FLAG=""
          if [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            POST_FLAG="--post"
          fi
          python3 .github/scripts/pr_reviewer.py \
            --diff-file "$DIFF_FILE" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.event.pull_request.head.sha }}" \
            --output "$REVIEW_FILE" \
            $POST_FLAG

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-review
          path: |
            ${{ env.DIFF_FILE }}
            ${{ env.REVIEW_FILE }}
          if-no-files-found: ignore
