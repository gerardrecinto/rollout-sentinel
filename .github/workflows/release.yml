name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch binaries
        run: |
          mkdir -p dist
          TAG_NAME=${GITHUB_REF_NAME:-v1.0.0}
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/rollout-sentinel-linux-amd64 ./cmd/sentinel
          tar -czf dist/rollout-sentinel_${TAG_NAME}_linux_amd64.tar.gz -C dist rollout-sentinel-linux-amd64
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/rollout-sentinel-linux-arm64 ./cmd/sentinel
          tar -czf dist/rollout-sentinel_${TAG_NAME}_linux_arm64.tar.gz -C dist rollout-sentinel-linux-arm64
          
          # Darwin amd64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/rollout-sentinel-darwin-amd64 ./cmd/sentinel
          tar -czf dist/rollout-sentinel_${TAG_NAME}_darwin_amd64.tar.gz -C dist rollout-sentinel-darwin-amd64
          
          # Darwin arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/rollout-sentinel-darwin-arm64 ./cmd/sentinel
          tar -czf dist/rollout-sentinel_${TAG_NAME}_darwin_arm64.tar.gz -C dist rollout-sentinel-darwin-arm64
          
          # Checksums
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cd ..

      - name: Build and Push Multi-Arch Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
