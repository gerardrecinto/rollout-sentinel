name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Auto-Remediate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/rollout-sentinel ./cmd/sentinel

      - name: Run unit and race tests
        id: test_step
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee test.log

      - name: AI Auto-Remediation and Triage
        if: failure() && steps.test_step.outcome == 'failure'
        run: |
          echo "Test failure detected. Running rollout-sentinel AI triage engine..."
          ./bin/rollout-sentinel triage --pod ci-worker-test --reason TestFailure --exit-code 1 > triage_report.txt || true
          cat triage_report.txt

      - name: Upload test and triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-and-triage-artifacts
          path: |
            test.log
            coverage.txt
            triage_report.txt
          if-no-files-found: ignore

      - name: Verify CLI subcommands
        run: |
          ./bin/rollout-sentinel version
          ./bin/rollout-sentinel check --service retail-checkout-api --namespace production
          ./bin/rollout-sentinel monitor --service retail-checkout-api --namespace production --steps 2
          ./bin/rollout-sentinel triage --pod retail-api-test-pod --reason OOMKilled --exit-code 137

  docker-build:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rollout-sentinel:ci
